[project]
name = "obsidian-rag"
version = "0.1.0"
description = "MCP server for embedding documents with deterministic feature-hashing embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "mcp>=1.0.0",
]

[project.scripts]
obsidian-rag-mcp = "obsidian_rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_rag"]
